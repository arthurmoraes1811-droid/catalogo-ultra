    <script>

        uploadArea.addEventListener(
            "dragover",

            (e) => {

                e.preventDefault()

                uploadArea.classList.add(
                    "drag"
                )

            }
        )

        uploadArea.addEventListener(
            "dragleave",

            () => {

                uploadArea.classList.remove(
                    "drag"
                )

            }
        )

        uploadArea.addEventListener(
            "drop",

            (e) => {

                e.preventDefault()

                uploadArea.classList.remove(
                    "drag"
                )

                inputImagem.files =
                    e.dataTransfer.files

                mostrarPreview()

            }
        )

        /* PREVIEW */

        function mostrarPreview(){

            const arquivo =
                inputImagem.files[0]

            if(arquivo){

                const reader =
                    new FileReader()

                reader.onload = function(e){

                    preview.src =
                        e.target.result

                    preview.style.display =
                        "block"
                }

                reader.readAsDataURL(
                    arquivo
                )
            }
        }
